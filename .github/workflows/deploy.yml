name: Deploy FitCal

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: fitcal-deploy-main
  cancel-in-progress: true

jobs:
  quality:
    name: Verify application
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  deploy:
    name: Update production server
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        env:
          FITCAL_DEPLOY_HOST: ${{ secrets.FITCAL_DEPLOY_HOST }}
          FITCAL_DEPLOY_KEY: ${{ secrets.FITCAL_DEPLOY_KEY }}
          FITCAL_DEPLOY_PORT: ${{ secrets.FITCAL_DEPLOY_PORT || '22' }}
          FITCAL_DEPLOY_USER: ${{ secrets.FITCAL_DEPLOY_USER }}
        run: |
          set -euo pipefail

          if [ -z "${FITCAL_DEPLOY_HOST}" ] || [ -z "${FITCAL_DEPLOY_USER}" ] || [ -z "${FITCAL_DEPLOY_KEY}" ]; then
            echo "Missing one of FITCAL_DEPLOY_HOST, FITCAL_DEPLOY_USER, FITCAL_DEPLOY_KEY." >&2
            exit 1
          fi

          install -m 700 -d ~/.ssh
          printf '%s\n' "${FITCAL_DEPLOY_KEY}" > ~/.ssh/fitcal_deploy_key
          chmod 600 ~/.ssh/fitcal_deploy_key
          ssh-keyscan -p "${FITCAL_DEPLOY_PORT}" -H "${FITCAL_DEPLOY_HOST}" >> ~/.ssh/known_hosts

          ssh \
            -i ~/.ssh/fitcal_deploy_key \
            -p "${FITCAL_DEPLOY_PORT}" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "${FITCAL_DEPLOY_USER}@${FITCAL_DEPLOY_HOST}" \
            "sudo /home/fitcal/app/update.sh"
